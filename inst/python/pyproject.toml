[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "registry", "state", "dyadic", "simulation", "clustering", "symbolic"]

[project]
name = "theory-engine"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "fastapi>=0.104",
  "uvicorn>=0.24",
  "rpy2>=3.5",
  "pyarrow>=14",
  "scipy>=1.11",
  "pandas>=2.1",
  "pydantic>=2.5",
  "pytest>=7.4",
  "httpx>=0.25",
  "umap-learn>=0.5",
  "scikit-learn>=1.3",
  "dd>=0.6"
]

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88
